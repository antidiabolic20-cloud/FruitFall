<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Tile Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="50%" stop-color="#1b0030" />
      <stop offset="100%" stop-color="#0d001a" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <!-- Strawberry Body Gradient -->
    <radialGradient id="strawGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="60%" stop-color="#e60039" />
      <stop offset="100%" stop-color="#800020" />
    </radialGradient>

    <!-- Strawberry Specular Highlight -->
    <radialGradient id="specular" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72efdd" />
      <stop offset="50%" stop-color="#38b000" />
      <stop offset="100%" stop-color="#004b23" />
    </linearGradient>

    <!-- Golden Starfruit Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066" />
      <stop offset="60%" stop-color="#ffd000" />
      <stop offset="100%" stop-color="#cc8800" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Container with Rounded Corners (iOS / Android standard style) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10" filter="url(#dropShadow)" />

  <!-- Background Ambient Rays / Magic Gravity Trails -->
  <g opacity="0.25">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#ff0080" stroke-width="3" stroke-dasharray="12 12" />
    <circle cx="256" cy="256" r="210" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 16" />
  </g>

  <!-- Gravity Aura Ring -->
  <ellipse cx="256" cy="380" rx="160" ry="24" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.4" filter="url(#glow)" />

  <!-- Main Hero Fruit: Glossy Strawberry -->
  <g transform="translate(0, -10)" filter="url(#dropShadow)">
    <!-- Strawberry Main Body Shape -->
    <path d="M 256 140 C 340 140 370 230 340 330 C 310 410 275 435 256 440 C 237 435 202 410 172 330 C 142 230 172 140 256 140 Z" fill="url(#strawGrad)" />
    <!-- Glossy Highlight Overlay -->
    <path d="M 256 140 C 340 140 370 230 340 330 C 310 410 275 435 256 440 C 237 435 202 410 172 330 C 142 230 172 140 256 140 Z" fill="url(#specular)" />

    <!-- Strawberry Seeds (Golden Dots) -->
    <g fill="#ffe600" opacity="0.85">
      <ellipse cx="220" cy="220" rx="4" ry="7" transform="rotate(-10 220 220)" />
      <ellipse cx="260" cy="210" rx="4" ry="7" />
      <ellipse cx="295" cy="230" rx="4" ry="7" transform="rotate(10 295 230)" />

      <ellipse cx="205" cy="270" rx="4.5" ry="8" transform="rotate(-15 205 270)" />
      <ellipse cx="256" cy="265" rx="4.5" ry="8" />
      <ellipse cx="305" cy="275" rx="4.5" ry="8" transform="rotate(15 305 275)" />

      <ellipse cx="225" cy="325" rx="4" ry="7.5" transform="rotate(-10 225 325)" />
      <ellipse cx="270" cy="320" rx="4" ry="7.5" transform="rotate(5 270 320)" />
      
      <ellipse cx="240" cy="375" rx="3.5" ry="6.5" transform="rotate(-5 240 375)" />
      <ellipse cx="270" cy="370" rx="3.5" ry="6.5" transform="rotate(5 270 370)" />
    </g>

    <!-- Strawberry Crown Leaves -->
    <g fill="url(#leafGrad)">
      <path d="M 256 155 C 230 120 180 125 160 145 C 190 160 220 165 240 170 Z" />
      <path d="M 256 155 C 282 120 332 125 352 145 C 322 160 292 165 272 170 Z" />
      <path d="M 256 155 C 240 110 256 85 256 85 C 256 85 272 110 256 155 Z" />
      <path d="M 256 160 C 220 165 190 190 180 205 C 210 195 235 185 250 175 Z" />
      <path d="M 256 160 C 292 165 322 190 332 205 C 302 195 277 185 262 175 Z" />
    </g>
    <!-- Stem -->
    <path d="M 252 105 Q 256 75 275 60 Q 270 80 260 102 Z" fill="#38b000" />
  </g>

  <!-- Secondary Companion Fruit: Golden Star Fruit Floating on Top Right -->
  <g transform="translate(320, 100) rotate(18) scale(0.7)" filter="url(#dropShadow)">
    <polygon points="100,10 126,68 188,76 142,118 154,180 100,150 46,180 58,118 12,76 74,68" fill="url(#starGrad)" stroke="#ffffff" stroke-width="3" />
    <polygon points="100,25 120,70 168,76 132,110 142,158 100,134 58,158 68,110 32,76 80,70" fill="#fff59d" opacity="0.5" />
  </g>

  <!-- Floating Magic Particles / Sparkles -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Big Sparkle Top Left -->
    <path d="M 100 120 Q 115 120 115 105 Q 115 120 130 120 Q 115 120 115 135 Q 115 120 100 120 Z" fill="#ffe600" />
    <!-- Sparkle Bottom Right -->
    <path d="M 380 370 Q 390 370 390 360 Q 390 370 400 370 Q 390 370 390 380 Q 390 370 380 370 Z" fill="#00f0ff" />
    <!-- Sparkle Left Center -->
    <path d="M 80 280 Q 90 280 90 270 Q 90 280 100 280 Q 90 280 90 290 Q 90 280 80 280 Z" fill="#ff00a0" />
    <!-- Small Orbs -->
    <circle cx="140" cy="180" r="5" fill="#72efdd" />
    <circle cx="370" cy="220" r="4" fill="#ffd000" />
    <circle cx="120" cy="380" r="6" fill="#ff4d6d" />
    <circle cx="330" cy="430" r="4.5" fill="#ffffff" />
  </g>
</svg>
